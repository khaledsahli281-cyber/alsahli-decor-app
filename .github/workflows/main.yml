name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project
        run: |
          unzip -q "ALSAHLI_DECOR_FIXED_SOURCE_1.0.zip" -d source

      - name: Build APK
        run: |
          cd source/android
          URL=$(grep 'distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)
          URL=${URL//\\:/\:}
          curl -L "$URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          GRADLE_HOME=$(find /tmp/gradle -maxdepth 1 -type d -name 'gradle-*' | head -1)
          "$GRADLE_HOME/bin/gradle" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSAHLI-DECOR-APK
          path: source/android/**/build/outputs/apk/debug/*.apk
